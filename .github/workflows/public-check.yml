name: public-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  public-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check public package invariants
        run: python scripts/check_public_package.py
      - name: Install and run unit tests
        run: |
          pip install -e ".[dev]"
          pytest -q
